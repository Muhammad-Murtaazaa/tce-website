name: Deploy React Website

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decode SSH Key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ./deploy_key
          chmod 644 ./deploy_key

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key_path: ./deploy_key
          port: 22
          script: |
            cd /var/www/tce-website
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ./deploy_key
