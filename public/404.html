<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Technicool Engineering (TCE)</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #0b121e;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .error-card {
        max-width: 540px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 48px 32px;
        backdrop-filter: blur(12px);
      }
      .logo-img {
        height: 64px;
        margin-bottom: 24px;
      }
      .error-code {
        font-size: 80px;
        font-weight: 800;
        line-height: 1;
        color: #0b4ea2;
        background: linear-gradient(135deg, #38bdf8 0%, #0b4ea2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        font-size: 15px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn-home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #0b4ea2;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 14px;
        transition: all 0.2s ease;
      }
      .btn-home:hover {
        background: #083c7d;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(11, 78, 162, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <img src="/TCE.png" alt="Technicool Engineering (TCE)" class="logo-img" />
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>The page or engineering resource you are looking for does not exist or has been moved. Explore our core HVAC-R solutions and V-Shift Elevators portfolio on our homepage.</p>
      <a href="/" class="btn-home">&larr; Return to Homepage</a>
    </div>
  </body>
</html>
